name: Build executables

# Builds tcx-bulk-gui (desktop window) and tcx-bulk (terminal) for Windows and Linux.
# Runs on every push, manually (Actions -> Run workflow) and on v* tags.
# Finished files: Actions tab -> pick a run -> Artifacts.
# Pushing a tag like v0.2.1 ALSO publishes a GitHub Release (with SHA256SUMS.txt) - that is what the
# in-app "Check for updates" button downloads from.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux - tkinter and Xvfb (for GUI tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Tests (Linux, GUI through Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Build executables
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-data sv_ttk --name tcx-bulk-gui --paths src packaging/gui_entry.py
          pyinstaller --noconfirm --onefile --name tcx-bulk --paths src packaging/cli_entry.py
      - name: Smoke test (CLI --help)
        run: ./dist/tcx-bulk --help
        if: runner.os == 'Linux'
      - name: Smoke test (CLI --help, Windows)
        run: .\dist\tcx-bulk.exe --help
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: tcx-bulk-${{ runner.os }}
          path: dist/*
      - name: Tag matches the program version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python -c "import sys, tcx_bulk; sys.exit(0 if 'v' + tcx_bulk.__version__ == '${{ github.ref_name }}' else 'Tag ${{ github.ref_name }} != version ' + tcx_bulk.__version__)"
      - name: Name the files for the release (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir release
          cp dist/tcx-bulk-gui release/tcx-bulk-gui-linux
          cp dist/tcx-bulk release/tcx-bulk-linux
      - name: Name the files for the release (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir release
          cp dist/tcx-bulk-gui.exe release/tcx-bulk-gui-windows.exe
          cp dist/tcx-bulk.exe release/tcx-bulk-windows.exe
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ runner.os }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum tcx-bulk* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
