name: Build executables

# Builds tcx-bulk-gui (desktop window) and tcx-bulk (terminal) for Windows and Linux.
#
#   * every push        -> builds, runs the tests, keeps the files as "Artifacts" of the run
#   * RELEASE (the new version offered by the in-app "Check for updates" button) happens AUTOMATICALLY:
#       push a commit that changes __version__ in src/tcx_bulk/__init__.py to a version that has no
#       release yet -> after the tests pass, Windows + Linux are built and a GitHub Release is created
#       (with SHA256SUMS.txt and the commit messages as release notes).
#       Only pushes to the branches listed in RELEASE_BRANCHES below can release.
#     Manual alternatives: Actions -> Run workflow -> type a version (v0.2.1), or push a tag v0.2.1.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this version (e.g. v0.2.1). Leave empty to only build."
        required: false
        default: ""

# One release at a time, so two quick pushes cannot both try to publish the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCHES: "main master claude/sweet-euler-0xowds"
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -z "$TAG" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/heads/* ]]; then
            for b in $RELEASE_BRANCHES; do
              if [ "$GITHUB_REF_NAME" = "$b" ]; then
                V=$(grep -oP '__version__ = "\K[^"]+' src/tcx_bulk/__init__.py)
                if ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then TAG="v$V"; fi
              fi
            done
          fi
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must look like v1.2.3, got: $TAG"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux - tkinter and Xvfb (for GUI tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Tag matches the program version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: python -c "import os, sys, tcx_bulk; t = os.environ['RELEASE_TAG']; sys.exit(0 if 'v' + tcx_bulk.__version__ == t else 'Release ' + t + ' does not match the program version ' + tcx_bulk.__version__ + ' - change __version__ first')"
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Tests (Linux, GUI through Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Build executables
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-data sv_ttk --name tcx-bulk-gui --paths src packaging/gui_entry.py
          pyinstaller --noconfirm --onefile --name tcx-bulk --paths src packaging/cli_entry.py
      - name: Smoke test (CLI --help)
        run: ./dist/tcx-bulk --help
        if: runner.os == 'Linux'
      - name: Smoke test (CLI --help, Windows)
        run: .\dist\tcx-bulk.exe --help
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: tcx-bulk-${{ runner.os }}
          path: dist/*
      - name: Name the files for the release (Linux)
        if: runner.os == 'Linux' && env.RELEASE_TAG != ''
        run: |
          mkdir release
          cp dist/tcx-bulk-gui release/tcx-bulk-gui-linux
          cp dist/tcx-bulk release/tcx-bulk-linux
      - name: Name the files for the release (Windows)
        if: runner.os == 'Windows' && env.RELEASE_TAG != ''
        shell: bash
        run: |
          mkdir release
          cp dist/tcx-bulk-gui.exe release/tcx-bulk-gui-windows.exe
          cp dist/tcx-bulk.exe release/tcx-bulk-windows.exe
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG != ''
        with:
          name: release-${{ runner.os }}
          path: release/*

  release:
    if: needs.meta.outputs.tag != ''
    needs: [meta, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, for the release notes
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum tcx-bulk* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release (creates the tag if it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          PREV=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then RANGE="$PREV..HEAD"; else RANGE="-n 15"; fi
          git log --no-merges --pretty='- %s' $RANGE > notes.md
          [ -s notes.md ] || echo "- Maintenance release" > notes.md
          gh release create "$TAG" release/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$TAG" --notes-file notes.md
